server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route 1: Điều hướng các request /identity/** về identity-service (port 8080)
        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1

        # Route 2: Mô phỏng route /product/** về product-service (port 8080)
        - id: product-service
          uri: http://localhost:8080
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
